<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login-screen">
  <form id="loginForm" class="login-card">
    <div class="logo">🎓</div>
    <h1>School Management</h1>
    <p>Welcome to your school portal</p>
    <label>Username</label>
    <input id="lu" required value="admin" placeholder="Enter username">
    <label>Password</label>
    <input id="lp" type="password" required value="admin123" placeholder="Enter password">
    <button class="btn primary full" type="submit">Login →</button>
    <p id="loginErr" class="error"></p>
    <small>Demo Login: admin / admin123</small>
  </form>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-icon">🎓</span>
      <div><strong>EduManage</strong><small>School Portal</small></div>
    </div>

    <div class="side-label">MAIN MENU</div>
    <button class="nav active" data-p="dashboard">🏠 Dashboard</button>
    <button class="nav" data-p="students">👨‍🎓 Students</button>
    <button class="nav" data-p="teachers">👩‍🏫 Teachers</button>
    <button class="nav" data-p="classes">🏫 Classes & Divisions</button>
    <button class="nav" data-p="attendance">📋 Attendance</button>
    <button class="nav" data-p="fees">💰 Fees</button>
    <button class="nav" data-p="results">📊 Results</button>
    <button class="nav" data-p="exams">📝 Exams</button>
    <button class="nav" data-p="notices">📢 Notices</button>
    <button class="nav" data-p="reports">📈 Reports</button>

    <div class="sidebar-footer">
      <small>Project Members</small>
      <strong>Shravani Pawar</strong>
      <strong>Tanvi Bahirwade</strong>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button>
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <small id="today"></small>
      </div>
      <button id="logout" class="btn logout">Logout ↗</button>
    </header>

    <section id="view" class="content"></section>

    <footer>© 2026 EduManage · School Management System</footer>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="mTitle">Form</h2>
      <button id="mClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
